<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B5B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8483A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#111318"/>

  <!-- Radar pulse rings -->
  <circle cx="100" cy="95" r="70" fill="none" stroke="#FF6B5B" stroke-width="2" opacity="0.15"/>
  <circle cx="100" cy="95" r="52" fill="none" stroke="#FF6B5B" stroke-width="2" opacity="0.25"/>
  <circle cx="100" cy="95" r="34" fill="none" stroke="#FF6B5B" stroke-width="2" opacity="0.35"/>

  <!-- Location pin -->
  <path d="M100 40
           C 74 40, 54 60, 54 86
           C 54 122, 100 165, 100 165
           C 100 165, 146 122, 146 86
           C 146 60, 126 40, 100 40 Z"
        fill="url(#pinGradient)"/>

  <!-- Inner circle of pin -->
  <circle cx="100" cy="87" r="20" fill="#111318"/>
  <circle cx="100" cy="87" r="12" fill="#FFFFFF"/>
</svg>
